[package]
name = "ddsify"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Batch PNG to DDS converter (BC1/BC7 with mipmaps), a todds replacement"

[dependencies]
clap = { version = "4.6.9", features = ["derive"], optional = true }
ddsfile = "0.6.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
intel_tex_2 = "0.5.0"
rayon = "1.12.0"
walkdir = "2.5.1"

[features]
# The CLI binary; library users can turn it off with default-features = false.
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "ddsify"
required-features = ["cli"]

[dev-dependencies]
bcdec_rs = "0.2.1"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
